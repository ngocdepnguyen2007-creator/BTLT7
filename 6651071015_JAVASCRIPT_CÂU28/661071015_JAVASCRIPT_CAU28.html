<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>JS DOM paragraph style</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        
        #jsstyle {
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        
        #jsstyle:hover {
            background-color: #0056b3;
        }
        
        #text {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>

    <p id="text">JavaScript Exercises - w3resource</p>
    
    <div>
        <button id="jsstyle" onclick="js_style()">Style</button>
    </div>

    <script>
        function js_style() {
            var p_text = document.getElementById("text");
            p_text.style.fontSize = "24pt";
            p_text.style.fontFamily = "Comic Sans MS, cursive, sans-serif";
            p_text.style.color = "green";
        }
    </script>

</body>
</html>
