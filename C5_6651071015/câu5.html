<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Câu 5</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div>
        <button id="showImageBtn">Show Image</button>
    </div>
    <div id="imageContainer"></div>
    <script>
        $(document).ready(function() {
            $("#showImageBtn").click(function() {
                var images = [
                    { src: "http://farm4.staticflickr.com/3691/11268502654_f28f05966c_m.jpg", w: "240", h: "160" },
                    { src: "http://farm1.staticflickr.com/33/45336904_1aef569b30_n.jpg", w: "320", h: "195" },
                    { src: "http://farm6.staticflickr.com/5211/5384592886_80a512e2c9.jpg", w: "500", h: "343" }
                ];
                var rand = images[Math.floor(Math.random() * images.length)];
                if ($("#displayImg").length === 0) {
                    $("#imageContainer").html("<img id='displayImg' />");
                }
                $("#displayImg").attr({
                    "src": rand.src,
                    "width": rand.w,
                    "height": rand.h
                });
            });
        });
    </script>
</body>
</html>
